<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rumo ao Topo · Placar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --pitch:#04120C; --surface:#0B1F15; --surface-2:#112A1D; --line:#1E3A2A;
  --gold:#D4A94E; --gold-hi:#F5E3AC; --gold-deep:#9A7526;
  --chalk:#F2F5F1; --ash:#93A79A; --red:#E5674E;
  --emerald:#34D98B; --amber:#F2A93B; --sky:#5BC8E8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--pitch);background-image:radial-gradient(80% 50% at 12% -5%, rgba(52,217,139,.10), transparent 60%),radial-gradient(70% 45% at 92% 0%, rgba(212,169,78,.13), transparent 62%);background-attachment:fixed;color:var(--chalk);
  font-family:'Archivo',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.hidden{display:none!important}
.gild{background:linear-gradient(168deg,var(--gold-hi) 4%,var(--gold) 44%,var(--gold-deep) 96%);
  -webkit-background-clip:text;background-clip:text;color:transparent}

/* ================= LOGIN ================= */
.login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;
  position:relative;isolation:isolate;overflow:hidden}
.login .bg{position:absolute;inset:0;z-index:-2;background-image:var(--img-login);
  background-size:cover;background-position:center}
.login::before{content:"";position:absolute;inset:0;z-index:-1;background:
  radial-gradient(70% 70% at 50% 50%, rgba(4,18,12,.86), rgba(4,18,12,.55) 60%, rgba(4,18,12,.35)),
  linear-gradient(0deg,rgba(4,18,12,.85) 0%,rgba(4,18,12,.25) 35%,transparent 65%)}
.login-box{width:100%;max-width:410px;margin:0 auto;text-align:center;
  background:rgba(6,20,13,.72);border:1px solid var(--line);border-radius:20px;
  padding:38px 34px 34px;backdrop-filter:blur(14px);
  box-shadow:0 30px 80px rgba(0,0,0,.55)}
.login-box label{text-align:left}
.eyebrow{display:inline-block;padding:7px 18px;border:1px solid rgba(212,169,78,.5);
  border-radius:100px;color:var(--gold);font-size:10px;font-weight:700;
  letter-spacing:.24em;text-transform:uppercase;margin-bottom:16px}
.login h1{font-size:clamp(2.2rem,7vw,3.2rem);font-weight:900;text-transform:uppercase;
  line-height:.98;letter-spacing:-.02em;margin:0 0 8px}
.login .sub{color:#C6D3CB;font-size:14px;margin:0 0 26px;line-height:1.5}
label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.6px;
  color:var(--ash);font-weight:700;margin:16px 0 6px}
input,select{width:100%;background:rgba(4,18,12,.75);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;color:var(--chalk);font-size:14px;font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--gold)}
.btn{width:100%;margin-top:22px;background:linear-gradient(168deg,var(--gold-hi),var(--gold) 60%,var(--gold-deep));
  color:#1A1304;border:none;border-radius:10px;padding:14px;font-size:13.5px;font-weight:900;
  font-family:inherit;cursor:pointer;text-transform:uppercase;letter-spacing:.08em}
.btn:disabled{opacity:.5;cursor:not-allowed}
.erro{margin-top:14px;color:var(--red);font-size:13px;line-height:1.5}

/* ================= APP ================= */
header{border-bottom:1px solid var(--line);padding:15px 22px;display:flex;
  align-items:center;gap:14px;flex-wrap:wrap;background:rgba(11,31,21,.6);
  position:sticky;top:0;z-index:20;backdrop-filter:blur(10px)}
.brand{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.22em;color:var(--gold)}
.quem{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ash)}
.quem b{color:var(--chalk);font-weight:700}
.sair{background:none;border:1px solid var(--line);color:var(--ash);border-radius:8px;
  padding:7px 12px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit}
.sair:hover{border-color:var(--red);color:var(--red)}
main{padding:0 22px 60px;max-width:1180px;margin:0 auto}

/* ---------- faixa do jogo ---------- */
.gamebar{position:relative;margin:0 -22px 26px;padding:30px 22px 28px;overflow:hidden;isolation:isolate}
.gamebar .bg{position:absolute;inset:0;z-index:-2;background-image:var(--img-soft);
  background-size:cover;background-position:center;opacity:.6}
.gamebar::before{content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(180deg,rgba(4,18,12,.72),rgba(4,18,12,.94))}
.gb-in{max-width:1180px;margin:0 auto;display:flex;align-items:flex-end;
  justify-content:space-between;gap:20px;flex-wrap:wrap}
.gb-k{font-size:10px;text-transform:uppercase;letter-spacing:.22em;color:var(--gold);font-weight:700}
.gb-v{font-size:clamp(1.5rem,4.2vw,2.4rem);font-weight:900;text-transform:uppercase;
  line-height:1;margin-top:9px;letter-spacing:-.01em}
.clock{display:flex;gap:9px}
.u{background:rgba(11,31,21,.8);border:1px solid var(--line);border-radius:11px;
  padding:10px 14px;text-align:center;min-width:64px}
.u span{display:block;font-size:1.35rem;font-weight:900;line-height:1;
  font-variant-numeric:tabular-nums;color:var(--gold-hi)}
.u small{display:block;margin-top:6px;font-size:8.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ash);font-weight:700}

/* ---------- abas ---------- */
.tabs{display:flex;gap:6px;margin-bottom:24px;flex-wrap:wrap}
.tab{background:none;border:1px solid var(--line);color:var(--ash);border-radius:100px;
  padding:8px 18px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.tab:hover{color:var(--chalk);border-color:rgba(212,169,78,.5)}
.tab.on{background:var(--gold);border-color:var(--gold);color:#1A1304}

h2{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--ash);
  font-weight:700;margin:32px 0 14px;display:flex;align-items:center;gap:14px}
h2:first-child{margin-top:0}
h2::after{content:"";flex:1;height:1px;background:var(--line)}

/* ---------- pódio ---------- */
.podio{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.jog{position:relative;border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;
  background:linear-gradient(150deg,rgba(22,48,33,.7),rgba(6,20,13,.75));
  transition:transform .28s,border-color .28s,box-shadow .28s;overflow:hidden}
.jog::before{content:"";position:absolute;right:-30px;top:-40px;width:160px;height:160px;
  border-radius:50%;background:radial-gradient(circle,var(--tom-glow),transparent 70%);pointer-events:none}
.jog::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--tom)}
.jog[data-tom="a"]{--tom:var(--emerald);--tom-glow:rgba(52,217,139,.20)}
.jog[data-tom="b"]{--tom:var(--gold);--tom-glow:rgba(212,169,78,.20)}
.jog[data-tom="c"]{--tom:var(--amber);--tom-glow:rgba(242,169,59,.20)}
.foto{border-color:var(--tom)!important}
.jog:hover{transform:translateY(-4px);border-color:rgba(212,169,78,.7)}
.jog:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}
.jog.eu{border-color:var(--gold)}
.jog.lider{border-color:var(--gold);box-shadow:0 16px 40px rgba(0,0,0,.5),0 0 0 1px rgba(212,169,78,.25) inset}
.jog-top{display:flex;gap:13px;align-items:center;position:relative;z-index:1}
.foto{width:76px;height:86px;border-radius:11px;overflow:hidden;flex:none;
  border:1px solid rgba(212,169,78,.35);background:#0A1E14}
.foto img{width:100%;height:100%;object-fit:cover;object-position:center 22%;display:block}
.jog:not(.lider):not(.eu) .foto img{filter:saturate(.6) brightness(.85)}
.jog-id{min-width:0;flex:1}
.jog-nome{font-size:1.15rem;font-weight:900;text-transform:uppercase;letter-spacing:.01em;line-height:1.05}
.jog-sub{font-size:10.5px;color:var(--ash);margin-top:4px;font-weight:600}
.cam{font-size:2.6rem;font-weight:900;line-height:.9;font-variant-numeric:tabular-nums;flex:none}
.selo{position:absolute;top:0;right:0;z-index:2;font-size:8.5px;font-weight:900;
  text-transform:uppercase;letter-spacing:.12em;padding:6px 12px;border-bottom-left-radius:12px;
  background:linear-gradient(168deg,var(--gold-hi),var(--gold) 60%,var(--gold-deep));color:#1A1304}
.gols{margin-top:14px;padding:13px;border-radius:12px;display:flex;align-items:baseline;gap:10px;
  background:rgba(4,18,12,.55);border:1px solid rgba(212,169,78,.25);position:relative;z-index:1}
.gols .v{font-size:2.1rem;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.gols .k{font-size:9px;text-transform:uppercase;letter-spacing:.13em;color:var(--ash);font-weight:700;line-height:1.3}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;position:relative;z-index:1}
.mini div{background:rgba(4,18,12,.4);border:1px solid var(--line);border-radius:9px;padding:9px 6px;text-align:center}
.mini .v{font-size:1rem;font-weight:800;font-variant-numeric:tabular-nums}
.mini div:nth-child(2) .v{color:var(--emerald)}
.mini div:nth-child(3) .v{color:var(--amber)}
.mini .k{font-size:8px;text-transform:uppercase;letter-spacing:.06em;color:var(--ash);font-weight:700;margin-top:3px}

/* ---------- pré-jogo: o que está em campo ---------- */
.pre{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;margin-bottom:8px}
.pre-bx{border:1px solid var(--line);border-radius:16px;padding:22px;
  background:linear-gradient(150deg,rgba(22,48,33,.62),rgba(6,20,13,.7))}
.pre-bx .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.2em;color:var(--gold);font-weight:800}
.pre-bx .big{font-size:clamp(2.4rem,7vw,3.6rem);font-weight:900;line-height:1;margin-top:10px;
  font-variant-numeric:tabular-nums}
.pre-bx .txt{font-size:12.5px;color:#C6D3CB;line-height:1.55;margin-top:12px;max-width:42ch}
.pre-bx .txt b{color:var(--chalk);font-weight:800}
.premio{position:relative;border:1px solid rgba(212,169,78,.4);border-radius:16px;
  overflow:hidden;min-height:180px;isolation:isolate;display:flex;align-items:flex-end;padding:20px}
.premio .bg{position:absolute;inset:0;z-index:-2;background-image:var(--img-premio);
  background-size:cover;background-position:center}
.premio::before{content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(0deg,rgba(4,18,12,.94) 8%,rgba(4,18,12,.45) 55%,rgba(4,18,12,.15))}
.premio .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.2em;color:var(--gold);font-weight:800}
.premio .v{font-size:1.3rem;font-weight:900;text-transform:uppercase;line-height:1.1;margin-top:7px}
.premio .s{font-size:11.5px;color:var(--ash);margin-top:6px}

/* ---------- meta coletiva ---------- */
.meta{border:1px solid var(--line);border-radius:16px;padding:20px;
  background:linear-gradient(178deg,rgba(20,44,31,.5),rgba(6,20,13,.55))}
.meta-l{display:flex;justify-content:space-between;align-items:baseline;
  gap:12px;flex-wrap:wrap;margin-bottom:10px}
.meta-l .k{font-size:10px;text-transform:uppercase;letter-spacing:.16em;
  color:var(--gold);font-weight:700}
.meta-l .v{font-size:13px;color:var(--ash);font-weight:600}
.meta-l .v b{color:var(--chalk);font-weight:800;font-variant-numeric:tabular-nums}
.trilho{height:10px;border-radius:6px;background:rgba(30,58,42,.6);overflow:hidden}
.trilho i{display:block;height:100%;border-radius:6px;min-width:2px;
  background:linear-gradient(90deg,var(--tomM,var(--gold-deep)),var(--tomM2,var(--gold-hi)));
  transition:width .8s cubic-bezier(.2,.7,.3,1)}
.meta + .meta{margin-top:12px}
.meta.a{--tomM:#1E8F5B;--tomM2:var(--emerald)}
.meta.a .meta-l .k{color:var(--emerald)}
.meta.b{--tomM:#A5701A;--tomM2:var(--amber)}
.meta.b .meta-l .k{color:var(--amber)}

/* ---------- funil ---------- */
.funil{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.fase{border:1px solid var(--line);border-radius:13px;padding:16px;background:rgba(11,31,21,.55);
  position:relative;overflow:hidden}
.fase .k{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--ash);font-weight:700}
.fase .v{font-size:1.7rem;font-weight:900;margin-top:7px;font-variant-numeric:tabular-nums}
.fase::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ash)}
.fase:nth-child(2)::before{background:var(--sky)}
.fase:nth-child(3)::before{background:var(--emerald)}
.fase:nth-child(4)::before{background:var(--gold)}
.fase:nth-child(2) .v{color:var(--sky)}
.fase:nth-child(3) .v{color:var(--emerald)}
.fase.gol{border-color:rgba(212,169,78,.5)}
.fase.gol .v{background:linear-gradient(168deg,var(--gold-hi),var(--gold) 55%,var(--gold-deep));
  -webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- tabela ---------- */
.barra-f{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.barra-f input,.barra-f select{flex:1;min-width:150px}
.painel{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
table{width:100%;border-collapse:collapse}
th{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--ash);font-weight:700;
  text-align:left;padding:11px 15px;border-bottom:1px solid var(--line);background:rgba(4,18,12,.6)}
td{padding:11px 15px;border-bottom:1px solid var(--line);font-size:13px}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
.pill{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;
  padding:4px 9px;border-radius:100px;white-space:nowrap}
.pill.livre{background:rgba(147,167,154,.14);color:var(--ash)}
.pill.meu{background:rgba(52,217,139,.16);color:var(--emerald)}
.pill.outro{background:rgba(4,18,12,.8);color:#5E7266}
.vazio{padding:34px;text-align:center;color:var(--ash);font-size:13.5px;line-height:1.6}
.dica{font-size:11.5px;color:#6F8478;margin-top:12px;line-height:1.55}
.load{padding:34px;text-align:center;color:var(--ash);font-size:13px}

@media (max-width:860px){
  main{padding:0 14px 50px}
  .gamebar{margin:0 -14px 20px;padding:22px 14px}
  .podio{grid-template-columns:1fr}
  .pre{grid-template-columns:1fr}
  .funil{grid-template-columns:1fr 1fr}
  .painel{overflow-x:auto}
  table{min-width:620px}
  header{padding:13px 14px}
  .u{min-width:56px;padding:8px 10px}
  .login-box{padding:30px 22px 26px}
}

/* ---------- página do assessor ---------- */
.jog{cursor:pointer}
.jog:hover{transform:translateY(-4px);border-color:rgba(212,169,78,.7)}
.jog:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}
.voltar{background:none;border:1px solid var(--line);color:var(--ash);border-radius:100px;
  padding:8px 16px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:20px}
.voltar:hover{color:var(--chalk);border-color:rgba(212,169,78,.5)}
.perfil{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:24px}
.perfil .retrato{width:104px;height:130px;border-radius:14px;overflow:hidden;
  border:1px solid rgba(212,169,78,.4);flex:none;position:relative}
.perfil .retrato img{width:100%;height:100%;object-fit:cover;display:block}
.perfil h3{margin:0;font-size:clamp(1.5rem,4vw,2.2rem);font-weight:900;
  text-transform:uppercase;letter-spacing:-.01em;line-height:1}
.perfil .meta-p{margin-top:8px;font-size:12.5px;color:var(--ash)}
.perfil .meta-p b{color:var(--gold-hi);font-weight:800}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;margin-bottom:8px}
.bx{border:1px solid var(--line);border-radius:12px;padding:14px;background:rgba(11,31,21,.6)}
.bx .k{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--ash);font-weight:700}
.bx .v{font-size:1.5rem;font-weight:900;margin-top:6px;font-variant-numeric:tabular-nums}
.bx.gol{border-color:rgba(212,169,78,.5)}
.bx.gol .v{background:linear-gradient(168deg,var(--gold-hi),var(--gold) 55%,var(--gold-deep));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.et{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;
  padding:4px 9px;border-radius:100px;white-space:nowrap}
.et.gol{background:linear-gradient(168deg,var(--gold-hi),var(--gold) 60%,var(--gold-deep));color:#1A1304}
.et.abriu{background:rgba(52,217,139,.16);color:var(--emerald)}
.et.tocado{background:rgba(147,167,154,.14);color:var(--ash)}

const INICIO = new Date("2026-09-14T09:00:00-03:00");

const FIM_2T = new Date("2026-12-20T23:59:59-03:00");

let EU = null, ABA = "placar", relogio = null;

// ---------------- login ----------------
el("btnEntrar").addEventListener("click", entrar);
["email","senha"].forEach(id =>
  el(id).addEventListener("keydown", e => { if(e.key === "Enter") entrar(); }));

async function entrar(){
  const email = el("email").value.trim(), senha = el("senha").value;
  if(!email || !senha) return mostrarErro("Preencha e-mail e senha.");
  el("btnEntrar").disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email, password: senha });
  el("btnEntrar").disabled = false;
  if(error) return mostrarErro(error.message === "Invalid login credentials"
    ? "E-mail ou senha não conferem." : error.message);
  boot();
}
function mostrarErro(msg){
  el("loginErro").textContent = msg;
  el("loginErro").classList.remove("hidden");
}
el("btnSair").addEventListener("click", async () => { await sb.auth.signOut(); location.reload(); });

// ---------------- boot ----------------
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ el("telaLogin").classList.remove("hidden"); el("telaApp").classList.add("hidden"); return; }

  const { data, error } = await sb.rpc("fn_camp_quem");
  const eu = (data && data[0]) || null;
  if(error || !eu){
    await sb.auth.signOut();
    el("telaLogin").classList.remove("hidden");
    return mostrarErro("Seu login existe, mas não está cadastrado na campanha. Fale com a Letícia.");
  }
  EU = eu;
  el("telaLogin").classList.add("hidden");
  el("telaApp").classList.remove("hidden");
  el("meuNome").textContent = eu.nome;
  el("meuPapel").textContent = eu.papel === "gerencia" ? "Gerência" : "Em campo";
  if(eu.papel === "gerencia") el("tabOrfas").classList.remove("hidden");

  tickJogo(); clearInterval(relogio); relogio = setInterval(tickJogo, 1000);
  document.querySelectorAll(".tab").forEach(b =>
    b.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(x => x.classList.remove("on"));
      b.classList.add("on"); ABA = b.dataset.aba; render();
    }));
  render();
}

// ---------------- relógio do jogo ----------------
function tickJogo(){
  const agora = new Date(), pad = n => String(n).padStart(2,"0");
  let k, v, alvo = null;
  if(agora < INICIO){        k = "Aquecimento · apito inicial em"; v = "14 de setembro, 9h"; alvo = INICIO; }
  else if(agora <= FIM_1T){  k = "1º tempo · disputa do iPhone";   v = "Encerra 16/11";      alvo = FIM_1T; }
  else if(agora <= FIM_2T){  k = "2º tempo · meta coletiva";       v = "Encerra 20/12";      alvo = FIM_2T; }
  else {                     k = "Apito final";                    v = "Campanha encerrada"; }
  el("gbK").textContent = k; el("gbV").textContent = v;
  if(!alvo){ el("gbClock").innerHTML = ""; clearInterval(relogio); return; }
  const s = Math.max(0, Math.floor((alvo - agora)/1000));
  el("gbClock").innerHTML = [
    [Math.floor(s/86400),      "dias"],
    [Math.floor(s/3600)%24,    "horas"],
    [Math.floor(s/60)%60,      "min"],
    [s%60,                     "seg"]
  ].map(([n,l]) => `<div class="u"><span>${pad(n)}</span><small>${l}</small></div>`).join("");
}

function render(){
  el("conteudo").innerHTML = '<div class="load">Carregando…</div>';
  if(ABA === "placar") verPlacar();
  else if(ABA === "leads") verLeads();
  else verOrfas();
}

// ---------------- placar ----------------
async function verPlacar(){
  const [{ data:placar, error:e1 }, { data:resumo, error:e2 }] =
    await Promise.all([ sb.rpc("fn_camp_placar"), sb.rpc("fn_camp_resumo") ]);
  if(e1 || e2) return falhou(e1 || e2);

  const r = {}; (resumo || []).forEach(x => r[x.etapa] = Number(x.quantos));
  const lista = placar || [];
  const ger = EU.papel === "gerencia";
  // ninguém marcou ainda? então não há líder — todos estão na largada
  const comecou = lista.some(p => Number(p.contas_ativas) > 0 || Number(p.contratos) > 0);

  const cards = lista.map(p => {
    const t = TIME[p.assessor] || {};
    const lider = comecou && p.posicao === 1;
    const esc = s => String(s).replace(/'/g, "\\'");
    return `
    <div class="jog ${p.eu ? "eu" : ""} ${lider ? "lider" : ""}" data-tom="${t.tom || "b"}" role="button" tabindex="0"
         onclick="abrirAssessor('${esc(p.assessor)}')"
         onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();abrirAssessor('${esc(p.assessor)}')}">
      ${lider ? '<span class="selo">Levando o iPhone</span>' : ""}
      <div class="jog-top">
        <span class="foto"><img src="${t.foto || ""}" alt="${p.nome_curto || p.assessor}"></span>
        <span class="jog-id">
          <span class="jog-nome">${p.nome_curto || p.assessor}</span>
          <span class="jog-sub">${p.eu ? "Você" : p.assessor} · ${
            comecou ? p.posicao + "º de " + p.total_no_ranking : "na largada"}</span>
        </span>
        <span class="cam gild">${t.num ?? ""}</span>
      </div>
      <div class="gols">
        <span class="v gild">${nf(p.contas_ativas)}</span>
        <span class="k">contas<br>ativas</span>
      </div>
      <div class="mini">
        <div><div class="v">${nf(p.leads_tocados)}</div><div class="k">Chamados</div></div>
        <div><div class="v">${nf(p.contas_abertas)}</div><div class="k">Abriram</div></div>
        <div><div class="v">${nf(p.contratos)}</div><div class="k">Contratos</div></div>
      </div>
    </div>`;
  }).join("");

  // meta coletiva: só a gerência enxerga o total do time
  const totContas = (r["4 - abriu e operou"] || 0);
  const totContratos = lista.reduce((s,p) => s + Number(p.contratos || 0), 0);
  const pc = Math.min(100, totContas / META_CONTAS * 100);
  const pk = Math.min(100, totContratos / META_CONTRATOS * 100);
  const metaHtml = ger ? `
    <h2>Meta coletiva · basta bater uma das duas</h2>
    <div class="meta a">
      <div class="meta-l"><span class="k">Meta A · contas ativas</span>
        <span class="v"><b>${nf(totContas)}</b> de ${nf(META_CONTAS)}</span></div>
      <div class="trilho"><i style="width:${pc}%"></i></div>
    </div>
    <div class="meta b">
      <div class="meta-l"><span class="k">Meta B · contratos BM&F</span>
        <span class="v"><b>${nf(totContratos)}</b> de ${nf(META_CONTRATOS)}</span></div>
      <div class="trilho"><i style="width:${pk}%"></i></div>
    </div>` : "";

  const livres = r["1 - nao tocado"] || 0;
  const preHtml = comecou ? "" : `
    <div class="pre">
      <div class="pre-bx">
        <div class="k">${ger ? "Base da campanha" : "Leads à sua espera"}</div>
        <div class="big gild">${nf(livres)}</div>
        <div class="txt">${ger
          ? "Leads limpos, sem clientes da casa e sem repetição. A lista é a mesma para os três: <b>quem chamar primeiro fica com o lead</b>."
          : "A lista é a mesma para os três. <b>Quem chamar primeiro fica com o lead</b> — e ele é seu até o fim da campanha."}</div>
      </div>
      <div class="premio">
        <div class="bg"></div>
        <div>
          <div class="k">1º tempo · prêmio</div>
          <div class="v">iPhone 17 Pro Max</div>
          <div class="s">Para quem tiver mais contas ativas até 16/11</div>
        </div>
      </div>
    </div>`;

  el("conteudo").innerHTML = `
    ${preHtml}
    <h2>${ger ? "Escalação e placar" : "Sua posição em campo"}</h2>
    <div class="podio">${cards || '<div class="vazio">O placar abre quando o jogo começar.</div>'}</div>
    ${metaHtml}
    <h2>${ger ? "Funil da campanha" : "Seu funil"}</h2>
    <div class="funil">
      <div class="fase"><div class="k">${ger ? "Não tocados" : "Leads livres"}</div><div class="v">${nf(r["1 - nao tocado"] || 0)}</div></div>
      <div class="fase"><div class="k">Tocados</div><div class="v">${nf(r["2 - tocado"] || 0)}</div></div>
      <div class="fase"><div class="k">Abriram conta</div><div class="v">${nf(r["3 - abriu conta"] || 0)}</div></div>
      <div class="fase gol"><div class="k">Abriram e operaram</div><div class="v">${nf(r["4 - abriu e operou"] || 0)}</div></div>
    </div>
    <div class="dica">Gol é conta aberta na barra da campanha que já operou BM&F.
    É ela que decide o iPhone; os contratos entram no desempate.</div>`;
}

let fLeads = { etapa:"", busca:"" };
function verLeads(){
  el("conteudo").innerHTML = `
    <h2>Leads da campanha</h2>
    <div class="barra-f">

    <div class="dica">Mostrando até 500 por vez. Use a busca ou o filtro para chegar ao que procura.</div>`;
  el("lEtapa").value = fLeads.etapa;
  el("lBusca").addEventListener("input", e => { fLeads.busca = e.target.value; debounce(carregarLeads); });
  el("lEtapa").addEventListener("change", e => { fLeads.etapa = e.target.value; carregarLeads(); });
  carregarLeads();
}
let timer;
function debounce(fn){ clearTimeout(timer); timer = setTimeout(fn, 350); }

async function carregarLeads(){
  const { data, error } = await sb.rpc("fn_camp_leads", {
    p_etapa: fLeads.etapa || null, p_busca: fLeads.busca || null });
  if(error) return falhou(error, "lLista");
  if(!data || !data.length){
    el("lLista").innerHTML = '<div class="vazio">Nenhum lead com esses filtros.</div>'; return;
  }
  const ger = EU.papel === "gerencia";
  el("lLista").innerHTML = `<table><thead><tr>
      <th>Lead</th><th>Telefone</th><th>${ger ? "Dono" : "Situação"}</th>
      <th>1º contato</th><th>Conta</th><th>Contratos</th>
    </tr></thead><tbody>` +
    data.map(l => {
      const cls = l.situacao === "livre" ? "livre" : (l.meu ? "meu" : "outro");
      return `<tr>
        <td style="font-weight:600">${l.nome || "—"}</td>
        <td style="color:var(--ash)">${l.telefone}</td>
        <td><span class="pill ${cls}">${l.situacao}</span></td>
        <td style="color:var(--ash)">${fmtDataHora(l.primeiro_contato)}</td>
        <td style="color:var(--ash)">${l.sinacor ? l.sinacor + " · " + fmtData(l.data_cadastro) : "—"}</td>
        <td>${l.contratos_bmf > 0 ? nf(l.contratos_bmf) : "—"}</td>
      </tr>`;
    }).join("") + "</tbody></table>";
}

// ---------------- contas a conferir ----------------
async function verOrfas(){
  const { data, error } = await sb.rpc("fn_camp_orfas");
  if(error) return falhou(error);
  const linhas = data || [];
  el("conteudo").innerHTML = `
    <h2>Contas na barra da campanha sem lead correspondente</h2>
    <div class="painel">` +
    (!linhas.length
      ? '<div class="vazio">Nenhuma conta órfã.<br>Tudo que abriu casou com um lead da lista.</div>'
      : `<table><thead><tr>
          <th>Cliente</th><th>Sinacor</th><th>Telefone</th><th>Cadastro</th><th>Contratos BM&F</th>
        </tr></thead><tbody>` +
        linhas.map(c => `<tr>
          <td style="font-weight:600">${c.nome}</td>
          <td style="color:var(--ash)">${c.sinacor || "—"}</td>
          <td style="color:var(--ash)">${c.telefone || "—"}</td>
          <td style="color:var(--ash)">${fmtData(c.data_cadastro)}</td>
          <td>${c.contratos_bmf > 0 ? nf(c.contratos_bmf) : "—"}</td>
        </tr>`).join("") + "</tbody></table>") + `</div>
    <div class="dica">Estas contas nasceram na barra da campanha mas o telefone não bate com
    nenhum lead da lista — provavelmente o cliente abriu com outro número. São gols sem dono:
    alguém precisa olhar e decidir de quem é o crédito.</div>`;
}

function falhou(e, alvo){
  const msg = (e && (e.message || e.hint)) || "Erro desconhecido";
  el(alvo || "conteudo").innerHTML =
    `<div class="vazio">Não consegui carregar.<br>
     <span style="font-size:11.5px;color:#6F8478">${msg}</span></div>`;
}

// ---------------- página do assessor ----------------
let VOLTAR_PARA = null;

async function abrirAssessor(assessor){
  VOLTAR_PARA = assessor;
  el("conteudo").innerHTML = '<div class="load">Carregando…</div>';
  const [{ data:placar }, { data:leads, error }] = await Promise.all([
    sb.rpc("fn_camp_placar"),
    sb.rpc("fn_camp_detalhe", { p_assessor: assessor })
  ]);
  if(error) return falhou(error);

  const p = (placar || []).find(x => x.assessor === assessor);
  if(!p) return falhou({ message: "Sem acesso a esta página." });
  const t = TIME[assessor] || {};
  const L = leads || [];
  const comecou = Number(p.contas_ativas) > 0 || Number(p.contratos) > 0;

  const ativaram = L.filter(l => l.etapa === "4 - abriu e operou");
  const abriram  = L.filter(l => l.etapa === "3 - abriu conta");
  const tocados  = L.filter(l => l.etapa === "2 - tocado");

  el("conteudo").innerHTML = `
    <button class="voltar" onclick="ABA='placar';marcarAba('placar');render()">← Voltar ao placar</button>

    <div class="perfil">
      <div class="retrato" style="border-color:var(--gold)"><img src="${t.foto || ""}" alt="${p.nome_curto || assessor}"></div>
      <div>
        <h3>${p.nome_curto || assessor}</h3>
        <div class="meta-p">Camisa <b>${t.num ?? "—"}</b> · ${assessor}
          ${comecou ? " · <b>" + p.posicao + "º</b> de " + p.total_no_ranking : " · na largada"}</div>
      </div>
    </div>

    <div class="grid5">
      <div class="bx"><div class="k">Leads chamados</div><div class="v">${nf(p.leads_tocados)}</div></div>
      <div class="bx"><div class="k">Abriram conta</div><div class="v">${nf(p.contas_abertas)}</div></div>
      <div class="bx gol"><div class="k">Ativaram · gols</div><div class="v">${nf(p.contas_ativas)}</div></div>
      <div class="bx"><div class="k">Contratos BM&F</div><div class="v">${nf(p.contratos)}</div></div>
      <div class="bx"><div class="k">Conversão</div><div class="v">${p.pct_conversao != null ? p.pct_conversao + "%" : "—"}</div></div>
    </div>
    <div class="dica">Conversão é quantos dos leads chamados viraram conta que já operou.</div>

    ${bloco("Ativaram · os gols", ativaram, "gol")}
    ${bloco("Abriram conta e ainda não operaram", abriram, "abriu")}
    ${bloco("Chamados e ainda sem conta", tocados, "tocado")}

    ${L.length ? "" : '<div class="vazio" style="margin-top:20px">Nenhum lead trabalhado ainda.</div>'}`;
}

function bloco(titulo, linhas, tipo){
  if(!linhas.length) return "";
  const temConta = tipo !== "tocado";
  return `
    <h2>${titulo} · ${nf(linhas.length)}</h2>
    <div class="painel"><table><thead><tr>
      <th>Cliente</th><th>Telefone</th><th>1º contato</th>
      ${temConta ? "<th>Sinacor</th><th>Abriu em</th>" : ""}
      ${tipo === "gol" ? "<th>Contratos</th><th>1ª operação</th>" : ""}
    </tr></thead><tbody>` +
    linhas.map(l => `<tr>
      <td style="font-weight:600">${l.nome_no_crm || l.nome || "—"}</td>
      <td style="color:var(--ash)">${l.telefone}</td>
      <td style="color:var(--ash)">${fmtDataHora(l.primeiro_contato)}</td>
      ${temConta ? `<td style="color:var(--ash)">${l.sinacor || "—"}</td>
                    <td style="color:var(--ash)">${fmtData(l.data_cadastro)}</td>` : ""}
      ${tipo === "gol" ? `<td style="font-weight:700">${nf(l.contratos_bmf)}</td>
                          <td style="color:var(--ash)">${fmtData(l.primeira_operacao)}</td>` : ""}
    </tr>`).join("") + "</tbody></table></div>";
}

function marcarAba(qual){
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x.dataset.aba === qual));
}

sb.auth.onAuthStateChange(evt => { if(evt === "SIGNED_OUT") location.reload(); });
boot();
</script>
</body>
</html>
